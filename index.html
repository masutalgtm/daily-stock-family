<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}
.sync-panel { margin:14px 0; padding:14px; border:1px solid var(--line); border-radius:14px; background:var(--panel); }
.sync-row { display:flex; flex-wrap:wrap; gap:8px; align-items:end; }
.sync-row .field { flex:1 1 190px; }
.sync-state { font-size:13px; color:var(--muted); margin:8px 0 0; }
.sync-state.online { color:#087a3e; font-weight:700; }
.sync-state.error { color:#b42318; font-weight:700; }
</style></head><body>
<title>日用品ストック帳</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: one narrow column. A filter row on top, then a card per place in the house (キッチン, 洗面…),
   each row = item name + status pill on the left, a minus / count / plus stepper on the right. */
:root {
  --font-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif;
  --bg: #eef2f0;
  --surface: #ffffff;
  --surface-2: #e3eae6;
  --line: #cbd5d0;
  --fg: #18231f;
  --muted: #56655f;
  --accent: #2d4a9e;
  --accent-fg: #ffffff;
  --accent-soft: #dde4f7;
  --ok: #1e7a4f;
  --ok-bg: #dcefe4;
  --warn: #8a5a00;
  --warn-bg: #fbebc8;
  --bad: #b0302b;
  --bad-bg: #f8dad7;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1512;
    --surface: #18201c;
    --surface-2: #222c27;
    --line: #33403a;
    --fg: #e7eeea;
    --muted: #9baaa3;
    --accent: #9db2ff;
    --accent-fg: #101a44;
    --accent-soft: #222c4f;
    --ok: #6fd0a0;
    --ok-bg: #173226;
    --warn: #efc26a;
    --warn-bg: #3a2e12;
    --bad: #ff9a92;
    --bad-bg: #3f1f1d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1512;
  --surface: #18201c;
  --surface-2: #222c27;
  --line: #33403a;
  --fg: #e7eeea;
  --muted: #9baaa3;
  --accent: #9db2ff;
  --accent-fg: #101a44;
  --accent-soft: #222c4f;
  --ok: #6fd0a0;
  --ok-bg: #173226;
  --warn: #efc26a;
  --warn-bg: #3a2e12;
  --bad: #ff9a92;
  --bad-bg: #3f1f1d;
  color-scheme: dark;
}

body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.6;
  padding-block: 24px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.wrap > * { min-width: 0; }

.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 16px; }
.titles { flex: 1 1 260px; min-width: 0; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1.3; margin: 0; text-wrap: balance; }
.lede { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
h2 { margin: 0; }

.btn, .step, .link, .chip {
  font: inherit;
  color: inherit;
  cursor: pointer;
}
.btn {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 8px;
  padding: 8px 14px;
  min-height: 40px;
  font-weight: 500;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 700; }
.btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.danger.sure { background: var(--bad); color: var(--surface); border-color: var(--bad); font-weight: 700; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.note { margin: 0; font-size: 13px; color: var(--muted); min-height: 0; }
.note:empty { display: none; }
.note.warn { color: var(--warn); background: var(--warn-bg); border-radius: 8px; padding: 8px 12px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.banner {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px;
  background: var(--accent-soft); border-radius: 12px; padding: 10px 14px; font-size: 14px;
}
.banner p { margin: 0; flex: 1 1 220px; }

.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field label { font-size: 12.5px; font-weight: 700; color: var(--muted); letter-spacing: .04em; }
.field input, .field select {
  font: inherit; font-size: 16px; color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-height: 40px; width: 100%; min-width: 0;
}
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }

.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 6px 14px; min-height: 38px; display: inline-flex; align-items: center; gap: 8px; font-weight: 500;
}
.chip .n { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 700; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.chip[aria-pressed="true"] .n { color: var(--accent-fg); }

.memo-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
.memo h2 { font-family: var(--font-display); font-size: 17px; }
.memo pre { margin: 0; font: inherit; white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; }

#groups { display: flex; flex-direction: column; gap: 20px; }
.group { display: flex; flex-direction: column; gap: 8px; }
.gh { font-family: var(--font-display); font-size: 14px; letter-spacing: .06em; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.gn { font-variant-numeric: tabular-nums; background: var(--surface-2); border-radius: 999px; padding: 0 8px; font-size: 12px; }
.rows { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px 12px; padding: 12px 14px; }
.row + .row { border-top: 1px solid var(--line); }
.info { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.name { font-weight: 700; font-size: 16px; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 12.5px; color: var(--muted); }
.pill { border-radius: 999px; padding: 1px 10px; font-weight: 700; font-size: 12px; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.low { background: var(--warn-bg); color: var(--warn); }
.pill.out { background: var(--bad-bg); color: var(--bad); }
.link { background: none; border: 0; padding: 4px 2px; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; font-size: 12.5px; }

.stepper { display: flex; align-items: center; gap: 4px; }
.step {
  width: 42px; height: 42px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg);
  font-size: 20px; line-height: 1; display: inline-grid; place-items: center;
}
.step:hover:not(:disabled) { background: var(--accent-soft); }
.step:disabled { opacity: .4; cursor: default; }
.count { min-width: 3.4em; text-align: center; font-variant-numeric: tabular-nums; display: flex; flex-direction: column; align-items: center; line-height: 1.15; }
.count b { font-family: var(--font-display); font-size: 22px; }
.count span { font-size: 11px; color: var(--muted); min-height: 1em; }
.count.low b { color: var(--warn); }
.count.out b { color: var(--bad); }

.editor { grid-column: 1 / -1; background: var(--bg); border-radius: 10px; padding: 12px; }
.empty { text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 28px 16px; margin: 0; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="wrap">
  <header class="head">
    <div class="titles">
      <h1>日用品ストック帳</h1>
      <p class="lede">家にある日用品の残りを数えて、なくなる前に買い足すためのリストです。</p>
    </div>
    <button type="button" class="btn primary" id="toggleAdd" aria-expanded="false" aria-controls="addForm">品目を追加</button>
  </header>

  <p class="note warn" id="modeNote" hidden></p>

  <section class="sync-panel" aria-labelledby="syncTitle">
    <strong id="syncTitle">夫婦共有・リアルタイム同期</strong>
    <p class="note">2人が同じ「家庭コード」を入力すると、在庫・買い物メモ・バーコード登録が同じ内容になります。</p>
    <div class="sync-row">
      <div class="field"><label for="householdCode">家庭コード</label><input id="householdCode" type="text" maxlength="24" autocomplete="off" autocapitalize="characters" placeholder="例：SATO-8K4M"></div>
      <button type="button" class="btn primary" id="connectSync">共有を開始</button>
      <button type="button" class="btn" id="makeCode">コードを作る</button>
      <button type="button" class="btn" id="copyCode">コードをコピー</button>
      <button type="button" class="btn" id="disconnectSync" hidden>共有を解除</button>
    </div>
    <p class="sync-state" id="syncState" role="status" aria-live="polite">端末内保存で使用中</p>
  </section>
  <div class="panel">
    <strong>バーコードで登録・補充</strong>
    <p class="note">iPhoneのSafariとAndroidに対応。商品を読み取ると、登録済みの商品は在庫を1つ増やし、未登録なら追加フォームへJANコードを入力します。</p>
    <div class="scan-actions">
      <button type="button" class="btn primary" id="startScan">カメラで読み取る</button>
      <button type="button" class="btn" id="manualScan">番号を手入力</button>
    </div>
    <div class="scan-box" id="scanBox" hidden>
      <video id="scanVideo" playsinline muted></video>
      <p class="scan-status" id="scanStatus" role="status" aria-live="polite">カメラを起動しています…</p>
      <button type="button" class="btn" id="stopScan">読み取りを終了</button>
    </div>
  </div>
  <form id="addForm" class="panel" hidden autocomplete="off">
    <div class="fields">
      <div class="field wide"><label for="add-name">品名</label><input id="add-name" data-f="name" type="text" maxlength="40" placeholder="例：食器用洗剤" required></div>
      <div class="field wide"><label for="add-barcode">JAN・バーコード番号</label><input id="add-barcode" data-f="barcode" class="barcode" type="text" inputmode="numeric" maxlength="32" placeholder="カメラ読取で自動入力"></div>
      <div class="field wide"><label for="add-cat">置き場所</label><select id="add-cat" data-f="cat"></select></div>
      <div class="field"><label for="add-count">今ある数</label><input id="add-count" data-f="count" type="number" inputmode="numeric" min="0" max="999" value="1"></div>
      <div class="field"><label for="add-min">この数以下で買い足す</label><input id="add-min" data-f="min" type="number" inputmode="numeric" min="0" max="999" value="1"></div>
      <div class="field"><label for="add-unit">単位</label><input id="add-unit" data-f="unit" type="text" maxlength="6" value="個"></div>
    </div>
    <div class="actions">
      <button type="submit" class="btn primary">追加する</button>
      <button type="button" class="btn" id="closeAdd">閉じる</button>
    </div>
  </form>

  <div class="banner" id="sampleBanner" hidden>
    <p>いまの品目は例です。数を増やしたり減らしたりして試せます。</p>
    <button type="button" class="btn" id="clearSamples">例をすべて消す</button>
  </div>

  <div class="filters" role="group" aria-label="表示する品目">
    <button type="button" class="chip" data-filter="all" aria-pressed="true">すべて <span class="n">0</span></button>
    <button type="button" class="chip" data-filter="buy" aria-pressed="false">買い足す <span class="n">0</span></button>
    <button type="button" class="chip" data-filter="ok" aria-pressed="false">足りてる <span class="n">0</span></button>
  </div>

  <section class="panel memo" id="memo" hidden aria-label="買い物メモ">
    <div class="memo-head">
      <h2>買い物メモ</h2>
      <button type="button" class="btn" id="copyMemo">コピー</button>
    </div>
    <pre id="memoText"></pre>
  </section>

  <p class="note" id="note" role="status" aria-live="polite"></p>

  <main id="groups"></main>
</div>

<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://unpkg.com/@zxing/browser@0.2.1"></script>
<script>
(function () {
  var CATS = ['キッチン', '洗面・浴室・トイレ', '掃除・洗濯', 'その他'];
  var LABEL = { out: '切れた', low: 'そろそろ買う', ok: '足りてる' };

  var items = new Map();
  var pending = new Map();
  var timers = new Map();
  var inflight = new Set();
  var dirty = new Set();
  var mode = 'loading';
  var col = null;
  var loaded = false;
  var filter = 'all';
  var editingId = null;
  var confirmId = null;
  var confTimer = null;
  var noteTimer = null;
  var memSeq = 0;
  var syncUnsub = null, syncUid = null, householdCode = '';

  function $(s) { return document.querySelector(s); }

  function h(tag, props) {
    var e = document.createElement(tag);
    if (props) {
      Object.keys(props).forEach(function (k) {
        var v = props[k];
        if (v == null || v === false) return;
        if (k === 'class') e.className = v;
        else if (k === 'text') e.textContent = v;
        else if (k.indexOf('data-') === 0 || k.indexOf('aria-') === 0 || k === 'type' || k === 'for' || k === 'id' || k === 'role') e.setAttribute(k, v === true ? '' : v);
        else e[k] = v;
      });
    }
    var kids = Array.prototype.slice.call(arguments, 2);
    kids.forEach(function add(c) {
      if (c == null || c === false) return;
      if (Array.isArray(c)) { c.forEach(add); return; }
      e.append(c.nodeType ? c : document.createTextNode(c));
    });
    return e;
  }

  function say(msg) {
    var n = $('#note');
    n.textContent = msg;
    clearTimeout(noteTimer);
    if (msg) noteTimer = setTimeout(function () { n.textContent = ''; }, 5000);
  }
  function failMsg(e) {
    if (e && (e.code === 'permission-denied' || e.code === 'permission_denied')) return '同期権限がありません。Firebaseの匿名認証とルール設定をご確認ください。';
    if (e && e.code === 'invalid_argument') return 'この画面では保存できません。閲覧のみの共有になっている可能性があります。';
    if (e && e.code === 'quota_exceeded') return '保存できる量の上限に達しました。使わない品目を削除してください。';
    return '保存できませんでした。少し待ってからもう一度お試しください。';
  }

  function eff(it) { return pending.has(it.id) ? pending.get(it.id) : it.count; }
  function statusOf(it) { var c = eff(it); return c <= 0 ? 'out' : (c <= it.min ? 'low' : 'ok'); }
  function rank(it) { return statusOf(it) === 'out' ? 0 : 1; }
  function catOf(it) { return CATS.indexOf(it.cat) >= 0 ? it.cat : 'その他'; }
  function byOrder(a, b) { return (a.order - b.order) || a.name.localeCompare(b.name, 'ja'); }
  function num(v, d) { var n = parseInt(v, 10); if (isNaN(n)) n = d; return Math.max(0, Math.min(999, n)); }

  /* ---------- storage ---------- */
  var STORAGE_KEY = 'daily-stock-book-v2';
  function persistLocal() {
    if (mode !== 'local') return;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(items.values())));
    } catch (e) { say('端末への保存に失敗しました。ブラウザの保存設定をご確認ください。'); }
  }
  function loadLocal() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      var arr = raw ? JSON.parse(raw) : [];
      if (!Array.isArray(arr)) arr = [];
      items = new Map();
      arr.forEach(function (v) {
        var id = String(v.id || ('l' + (++memSeq)));
        items.set(id, {
          id: id, name: String(v.name || '名称未設定'), cat: String(v.cat || 'その他'),
          count: num(v.count, 0), min: num(v.min, 1), unit: String(v.unit || ''),
          barcode: String(v.barcode || ''), order: typeof v.order === 'number' ? v.order : 0, sample: v.sample === true
        });
      });
    } catch (e) { items = new Map(); }
  }
  function write(id, data) {
    if (mode === 'db') { data.updatedBy=syncUid; data.updatedAt=firebase.firestore.FieldValue.serverTimestamp(); return col.doc(id).update(data); }
    var it = items.get(id);
    if (it) Object.assign(it, data);
    persistLocal();
    return Promise.resolve();
  }
  async function flush(id) {
    if (inflight.has(id)) { dirty.add(id); return; }
    var val = pending.get(id);
    if (val === undefined) return;
    inflight.add(id);
    try {
      await write(id, { count: val });
      var it = items.get(id);
      if (it) it.count = val;
    } catch (e) {
      pending.delete(id);
      say(failMsg(e));
    } finally {
      inflight.delete(id);
      if (dirty.has(id)) { dirty.delete(id); flush(id); }
      else if (pending.get(id) === val) pending.delete(id);
    }
    render();
  }
  function bump(id, d) {
    var it = items.get(id);
    if (!it) return;
    pending.set(id, num(eff(it) + d, 0));
    render();
    var sel = '[data-id="' + CSS.escape(id) + '"] [data-act="' + (d > 0 ? 'inc' : 'dec') + '"]';
    var b = document.querySelector(sel);
    if (b) b.focus();
    clearTimeout(timers.get(id));
    timers.set(id, setTimeout(function () { flush(id); }, 400));
  }
  async function addItem(data) {
    try {
      if (mode === 'db') {
        data.updatedBy=syncUid; data.updatedAt=firebase.firestore.FieldValue.serverTimestamp();
        await col.add(data);
      } else {
        var id = 'l' + Date.now() + '-' + (++memSeq);
        items.set(id, Object.assign({ id: id }, data));
        persistLocal();
      }
      return true;
    } catch (e) { say(failMsg(e)); return false; }
  }
  async function removeItem(id) {
    try {
      if (mode === 'db') await col.doc(id).delete();
      items.delete(id);
      persistLocal();
      pending.delete(id);
      editingId = null; confirmId = null;
      say('削除しました');
    } catch (e) { say(failMsg(e)); }
    render();
  }

  /* ---------- family cloud sync ---------- */
  function cleanHouseCode(v) { return String(v || '').toUpperCase().replace(/[^A-Z0-9-]/g, '').slice(0, 24); }
  function setSyncState(text, kind) {
    var e = $('#syncState'); e.textContent = text; e.className = 'sync-state' + (kind ? ' ' + kind : '');
  }
  function stopCloudSync() {
    if (syncUnsub) { try { syncUnsub(); } catch (e) {} syncUnsub = null; }
  }
  async function uploadLocalIfCloudEmpty(snapshot) {
    if (!snapshot.empty || items.size === 0) return;
    var local = Array.from(items.values());
    var batch = firebase.firestore().batch();
    local.forEach(function (it) {
      var id = String(it.id || ('l' + Date.now() + '-' + (++memSeq)));
      batch.set(col.doc(id), {
        name:String(it.name || '名称未設定'), cat:String(it.cat || 'その他'), count:num(it.count,0),
        min:num(it.min,1), unit:String(it.unit || ''), barcode:String(it.barcode || ''),
        order:typeof it.order === 'number' ? it.order : Date.now(), sample:it.sample === true,
        updatedBy:syncUid, updatedAt:firebase.firestore.FieldValue.serverTimestamp()
      });
    });
    await batch.commit();
    say('この端末の在庫を共有データへ移しました');
  }
  async function connectHousehold(code) {
    code = cleanHouseCode(code);
    if (code.length < 8) { say('家庭コードは8文字以上にしてください'); return; }
    if (!window.FIREBASE_CONFIG || !window.FIREBASE_CONFIG.apiKey || /YOUR_|ここに/.test(window.FIREBASE_CONFIG.apiKey)) {
      setSyncState('Firebase設定が未入力です。firebase-config.jsを設定してください', 'error'); return;
    }
    try {
      setSyncState('共有先へ接続しています…');
      if (!firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG);
      var cred = firebase.auth().currentUser ? { user: firebase.auth().currentUser } : await firebase.auth().signInAnonymously();
      syncUid = cred.user.uid;
      householdCode = code;
      localStorage.setItem('daily-stock-household-code', code);
      $('#householdCode').value = code;
      stopCloudSync();
      var db = firebase.firestore();
      col = db.collection('households').doc(code).collection('items');
      var first = true;
      syncUnsub = col.orderBy('order').onSnapshot(async function (snap) {
        if (first) { first = false; await uploadLocalIfCloudEmpty(snap); if (snap.empty && items.size) return; }
        var next = new Map();
        snap.docs.forEach(function (d) {
          var v=d.data() || {};
          next.set(d.id,{id:d.id,name:String(v.name||'名称未設定'),cat:String(v.cat||'その他'),count:num(v.count,0),min:num(v.min,1),unit:String(v.unit||''),barcode:String(v.barcode||''),order:typeof v.order==='number'?v.order:0,sample:v.sample===true});
        });
        items=next; mode='db'; loaded=true;
        $('#modeNote').hidden=true; $('#disconnectSync').hidden=false;
        setSyncState('同期中：家庭コード ' + code, 'online'); render();
      }, function(e){ setSyncState(failMsg(e),'error'); });
    } catch(e) { mode='local'; setSyncState(failMsg(e),'error'); }
  }
  function disconnectHousehold() {
    stopCloudSync(); householdCode=''; col=null; mode='local'; syncUid=null;
    localStorage.removeItem('daily-stock-household-code'); loadLocal(); loaded=true;
    $('#householdCode').value=''; $('#disconnectSync').hidden=true;
    setSyncState('端末内保存で使用中'); render(); say('共有を解除しました');
  }
  $('#makeCode').addEventListener('click', function(){
    var chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789', code='FAMILY-';
    if (window.crypto && crypto.getRandomValues) { var a=new Uint32Array(6); crypto.getRandomValues(a); for(var i=0;i<a.length;i++) code+=chars[a[i]%chars.length]; }
    else { for(var j=0;j<6;j++) code+=chars[Math.floor(Math.random()*chars.length)]; }
    $('#householdCode').value=code; say('家庭コードを作りました。「共有を開始」を押してください');
  });
  $('#connectSync').addEventListener('click', function(){ connectHousehold($('#householdCode').value); });
  $('#copyCode').addEventListener('click', async function(){
    var code=cleanHouseCode($('#householdCode').value); if(!code){say('先に家庭コードを作成してください');return;}
    try { await navigator.clipboard.writeText(code); say('家庭コードをコピーしました。奥さまへ送ってください'); } catch(e) { prompt('このコードをコピーしてください',code); }
  });
  $('#disconnectSync').addEventListener('click', disconnectHousehold);

  /* ---------- rendering ---------- */
  function emptyText(total) {
    if (!loaded) return '読み込んでいます…';
    if (total === 0) return 'まだ品目がありません。「品目を追加」から、家にある日用品を登録してください。';
    return filter === 'buy' ? '買い足すものはありません。' : '足りてる品目はありません。';
  }

  function editorEl(it) {
    var id = it.id;
    function fld(label, fid, input, wide) {
      return h('div', { class: 'field' + (wide ? ' wide' : '') }, h('label', { for: fid, text: label }), input);
    }
    var sel = h('select', { id: 'ed-cat-' + id, 'data-f': 'cat' });
    CATS.forEach(function (c) { sel.append(h('option', { value: c, text: c, selected: catOf(it) === c })); });
    return h('form', { class: 'editor', 'data-id': id, autocomplete: 'off' },
      h('div', { class: 'fields' },
        fld('品名', 'ed-name-' + id, h('input', { id: 'ed-name-' + id, 'data-f': 'name', type: 'text', maxLength: 40, value: it.name, required: true }), true),
        fld('JAN・バーコード番号', 'ed-barcode-' + id, h('input', { id: 'ed-barcode-' + id, 'data-f': 'barcode', class: 'barcode', type: 'text', inputMode: 'numeric', maxLength: 32, value: it.barcode || '' }), true),
        fld('置き場所', 'ed-cat-' + id, sel, true),
        fld('この数以下で買い足す', 'ed-min-' + id, h('input', { id: 'ed-min-' + id, 'data-f': 'min', type: 'number', min: '0', max: '999', value: String(it.min), inputMode: 'numeric' })),
        fld('単位', 'ed-unit-' + id, h('input', { id: 'ed-unit-' + id, 'data-f': 'unit', type: 'text', maxLength: 6, value: it.unit || '' }))
      ),
      h('div', { class: 'actions' },
        h('button', { type: 'submit', class: 'btn primary', text: '保存' }),
        h('button', { type: 'button', class: 'btn', 'data-act': 'cancel', text: '閉じる' }),
        h('button', { type: 'button', class: 'btn danger' + (confirmId === id ? ' sure' : ''), 'data-act': 'del', text: confirmId === id ? '本当に削除する' : '削除' })
      )
    );
  }

  function rowEl(it) {
    var st = statusOf(it), c = eff(it), unit = it.unit || '';
    var editing = editingId === it.id;
    var li = h('li', { class: 'row', 'data-id': it.id },
      h('div', { class: 'info' },
        h('div', { class: 'name', text: it.name }),
        h('div', { class: 'meta' },
          h('span', { class: 'pill ' + st, text: LABEL[st] }),
          h('span', { text: it.min > 0 ? it.min + unit + '以下で買い足し' : '切れたら買う' }),
          it.barcode ? h('span', { class: 'barcode', text: 'JAN ' + it.barcode }) : null,
          h('button', { type: 'button', class: 'link', 'data-act': 'edit', 'aria-expanded': String(editing), text: editing ? '閉じる' : '編集' })
        )
      ),
      h('div', { class: 'stepper' },
        h('button', { type: 'button', class: 'step', 'data-act': 'dec', 'aria-label': it.name + 'を1つ減らす', disabled: c <= 0, text: '−' }),
        h('div', { class: 'count ' + st }, h('b', { text: String(c) }), h('span', { text: unit })),
        h('button', { type: 'button', class: 'step', 'data-act': 'inc', 'aria-label': it.name + 'を1つ増やす', disabled: c >= 999, text: '＋' })
      )
    );
    if (editing) li.append(editorEl(it));
    return li;
  }

  function render() {
    var all = Array.from(items.values());
    var buy = all.filter(function (i) { return statusOf(i) !== 'ok'; });
    var counts = { all: all.length, buy: buy.length, ok: all.length - buy.length };
    document.querySelectorAll('[data-filter]').forEach(function (b) {
      var f = b.dataset.filter;
      b.setAttribute('aria-pressed', String(filter === f));
      b.querySelector('.n').textContent = String(counts[f]);
    });
    $('#sampleBanner').hidden = !all.some(function (i) { return i.sample; });

    buy.sort(function (a, b) { return (rank(a) - rank(b)) || a.name.localeCompare(b.name, 'ja'); });
    $('#memo').hidden = buy.length === 0;
    $('#memoText').textContent = buy.map(function (i) {
      return '・' + i.name + '（' + (eff(i) <= 0 ? '切れてる' : '残り' + eff(i) + (i.unit || '')) + '）';
    }).join('\n');

    var root = $('#groups');
    root.replaceChildren();
    var shown = all.filter(function (i) {
      var s = statusOf(i);
      return filter === 'all' || (filter === 'buy' ? s !== 'ok' : s === 'ok');
    });
    if (!shown.length) { root.append(h('p', { class: 'empty', text: emptyText(all.length) })); return; }
    CATS.forEach(function (cat) {
      var list = shown.filter(function (i) { return catOf(i) === cat; }).sort(byOrder);
      if (!list.length) return;
      root.append(h('section', { class: 'group' },
        h('h2', { class: 'gh' }, cat, h('span', { class: 'gn', text: String(list.length) })),
        h('ul', { class: 'rows' }, list.map(rowEl))
      ));
    });
  }

  /* ---------- events ---------- */
  $('#groups').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-act]');
    if (!btn) return;
    var li = btn.closest('[data-id]');
    if (!li) return;
    var id = li.dataset.id, act = btn.dataset.act;
    if (act === 'inc') bump(id, 1);
    else if (act === 'dec') bump(id, -1);
    else if (act === 'edit') {
      editingId = editingId === id ? null : id; confirmId = null; render();
      if (editingId) { var n = document.getElementById('ed-name-' + id); if (n) n.focus(); }
    } else if (act === 'cancel') { editingId = null; confirmId = null; render(); }
    else if (act === 'del') {
      if (confirmId !== id) {
        confirmId = id; render();
        clearTimeout(confTimer);
        confTimer = setTimeout(function () { confirmId = null; render(); }, 5000);
      } else removeItem(id);
    }
  });

  $('#groups').addEventListener('submit', async function (e) {
    e.preventDefault();
    var f = e.target.closest('form');
    if (!f) return;
    var id = f.dataset.id;
    var name = f.querySelector('[data-f="name"]').value.trim().slice(0, 40);
    if (!name) return;
    var data = {
      name: name,
      cat: f.querySelector('[data-f="cat"]').value,
      barcode: f.querySelector('[data-f="barcode"]').value.trim().replace(/[^0-9A-Za-z-]/g, '').slice(0, 32),
      min: num(f.querySelector('[data-f="min"]').value, 1),
      unit: f.querySelector('[data-f="unit"]').value.trim().slice(0, 6)
    };
    try {
      await write(id, data);
      var it = items.get(id);
      if (it) Object.assign(it, data);
      editingId = null; confirmId = null;
      say('保存しました');
    } catch (err) { say(failMsg(err)); }
    render();
  });

  document.querySelectorAll('[data-filter]').forEach(function (b) {
    b.addEventListener('click', function () { filter = b.dataset.filter; render(); });
  });

  var addForm = $('#addForm');
  function setAdd(open) {
    addForm.hidden = !open;
    $('#toggleAdd').setAttribute('aria-expanded', String(open));
    if (open) $('#add-name').focus();
  }
  $('#toggleAdd').addEventListener('click', function () { setAdd(addForm.hidden); });
  $('#closeAdd').addEventListener('click', function () { setAdd(false); $('#toggleAdd').focus(); });
  addForm.addEventListener('submit', async function (e) {
    e.preventDefault();
    var name = $('#add-name').value.trim().slice(0, 40);
    if (!name) return;
    var ok = await addItem({
      name: name,
      barcode: $('#add-barcode').value.trim().replace(/[^0-9A-Za-z-]/g, '').slice(0, 32),
      cat: $('#add-cat').value,
      count: num($('#add-count').value, 1),
      min: num($('#add-min').value, 1),
      unit: $('#add-unit').value.trim().slice(0, 6),
      order: Date.now(),
      sample: false
    });
    if (ok) {
      say('「' + name + '」を追加しました');
      $('#add-name').value = '';
      $('#add-barcode').value = '';
      render();
      $('#add-name').focus();
    }
  });

  $('#clearSamples').addEventListener('click', async function () {
    var ids = Array.from(items.values()).filter(function (i) { return i.sample; }).map(function (i) { return i.id; });
    try {
      for (var k = 0; k < ids.length; k++) {
        if (mode === 'db') await col.doc(ids[k]).delete();
        items.delete(ids[k]);
      }
      persistLocal();
      say('例を消しました。「品目を追加」から自分の品目を登録できます');
    } catch (err) { say(failMsg(err)); }
    render();
  });

  $('#copyMemo').addEventListener('click', async function () {
    var pre = $('#memoText');
    try {
      await navigator.clipboard.writeText(pre.textContent);
      say('コピーしました');
    } catch (err) {
      var r = document.createRange();
      r.selectNodeContents(pre);
      var s = window.getSelection();
      s.removeAllRanges(); s.addRange(r);
      say('コピーできませんでした。選択した文字を長押ししてコピーしてください');
    }
  });


  /* ---------- barcode scanner: iPhone/Safari + Android ---------- */
  var scanStream = null, scanTimer = null, detector = null, scanBusy = false;
  var zxingReader = null, zxingControls = null, acceptedScan = false;
  function normalCode(v) { return String(v || '').trim().replace(/\s+/g, '').slice(0, 32); }
  function findByBarcode(code) {
    var hit = null;
    items.forEach(function (it) { if (!hit && normalCode(it.barcode) === code) hit = it; });
    return hit;
  }
  function acceptBarcode(raw) {
    var code = normalCode(raw);
    if (!code || acceptedScan) return;
    acceptedScan = true;
    stopScanner();
    if (navigator.vibrate) navigator.vibrate(80);
    var hit = findByBarcode(code);
    if (hit) {
      bump(hit.id, 1);
      say('「' + hit.name + '」の在庫を1つ増やしました');
      return;
    }
    setAdd(true);
    $('#add-barcode').value = code;
    $('#add-name').focus();
    say('未登録のバーコードです。品名を入力して登録してください。次回から自動で補充できます');
  }
  async function scanFrame() {
    if (!scanStream || scanBusy || acceptedScan) return;
    scanBusy = true;
    try {
      var found = await detector.detect($('#scanVideo'));
      if (found && found.length) { acceptBarcode(found[0].rawValue); return; }
    } catch (e) {}
    finally { scanBusy = false; }
    if (scanStream) scanTimer = setTimeout(scanFrame, 180);
  }
  async function startNativeScanner() {
    detector = new BarcodeDetector({ formats: ['ean_13','ean_8','upc_a','upc_e','code_128','itf'] });
    scanStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false
    });
    $('#scanVideo').srcObject = scanStream;
    await $('#scanVideo').play();
    scanFrame();
  }
  async function startZxingScanner() {
    if (!window.ZXingBrowser || !ZXingBrowser.BrowserMultiFormatReader) throw new Error('ZXing unavailable');
    zxingReader = new ZXingBrowser.BrowserMultiFormatReader();
    zxingControls = await zxingReader.decodeFromConstraints(
      { video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false },
      $('#scanVideo'),
      function (result, error, controls) {
        if (result && !acceptedScan) acceptBarcode(result.getText());
      }
    );
  }
  async function startScanner() {
    acceptedScan = false;
    if (!window.isSecureContext) {
      say('カメラにはHTTPS接続が必要です。公開URLから開いてください'); return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      say('この環境ではカメラを利用できません。番号を手入力してください'); return;
    }
    $('#scanBox').hidden = false;
    $('#scanStatus').textContent = '背面カメラを起動しています。バーコードを横向きに大きく映してください';
    try {
      // Safari/iPhoneではBarcodeDetectorが通常使えないためZXingを優先する。
      if (/iPad|iPhone|iPod/.test(navigator.userAgent) || !('BarcodeDetector' in window)) {
        await startZxingScanner();
      } else {
        await startNativeScanner();
      }
      $('#scanStatus').textContent = 'バーコードを枠内に大きく映してください';
    } catch (e) {
      stopScanner();
      say('カメラを開始できませんでした。Safariの設定でカメラを許可し、HTTPSのURLから再度お試しください');
    }
  }
  function stopScanner() {
    clearTimeout(scanTimer); scanTimer = null;
    if (zxingControls && typeof zxingControls.stop === 'function') { try { zxingControls.stop(); } catch (e) {} }
    zxingControls = null; zxingReader = null;
    if (scanStream) scanStream.getTracks().forEach(function (t) { t.stop(); });
    scanStream = null; scanBusy = false;
    var v = $('#scanVideo');
    if (v.srcObject) {
      try { v.srcObject.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
      v.srcObject = null;
    }
    $('#scanBox').hidden = true;
  }
  $('#startScan').addEventListener('click', startScanner);
  $('#stopScan').addEventListener('click', stopScanner);
  $('#manualScan').addEventListener('click', function () {
    acceptedScan = false;
    var code = prompt('JAN・バーコード番号を入力してください');
    if (code !== null) acceptBarcode(code);
  });
  document.addEventListener('visibilitychange', function () { if (document.hidden) stopScanner(); });
  window.addEventListener('pagehide', stopScanner);

  /* ---------- start ---------- */
  var sel = $('#add-cat');
  CATS.forEach(function (c) { sel.append(h('option', { value: c, text: c })); });
  render();

  (async function init() {
    loadLocal(); loaded = true; mode = 'local';
    $('#modeNote').textContent = 'この端末のブラウザ内に自動保存します。家庭コードを接続すると夫婦で同期します。';
    $('#modeNote').hidden = false; render();
    var saved = cleanHouseCode(localStorage.getItem('daily-stock-household-code'));
    if (saved) { $('#householdCode').value = saved; await connectHousehold(saved); }
  })();
})();
</script>

</body></html>
